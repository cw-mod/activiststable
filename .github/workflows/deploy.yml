# Build static site into /docs on mistress for GitHub Pages
# Pages settings: Branch mistress → Folder /docs
# Site: https://cw-mod.github.io/activiststable/
name: Deploy to GitHub Pages

on:
  push:
    branches: [mistress]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip the commit that this workflow itself pushes (avoids loops)
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

      - name: Publish to docs/
        run: |
          rm -rf docs
          mkdir -p docs
          cp -a out/. docs/
          touch docs/.nojekyll

      - name: Commit and push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No docs changes"
            exit 0
          fi
          git commit -m "Deploy Pages site ${GITHUB_SHA}"
          git push origin HEAD:mistress
