# Deploy:
# 1) GitHub Pages → https://cw-mod.github.io/activiststable/
# 2) VPS           → https://activists.miew.ru/  (SSH secrets)
name: Deploy

on:
  push:
    branches: [mistress]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-activiststable
  cancel-in-progress: false

jobs:
  pages:
    name: GitHub Pages
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build:pages
        env:
          DEPLOY_TARGET: pages

      - name: Publish static files to docs/ and root
        run: |
          set -euo pipefail
          rm -rf docs
          mkdir -p docs
          cp -a out/. docs/
          touch docs/.nojekyll

          cp -a docs/.nojekyll docs/index.html docs/404.html docs/index.txt docs/logo.svg docs/robots.txt .
          cp -a docs/__next.__PAGE__.txt docs/__next._full.txt docs/__next._tree.txt .
          cp -a docs/_not-found.html docs/_not-found.txt .
          rm -rf _next _not-found
          cp -a docs/_next docs/_not-found .

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .nojekyll index.html 404.html index.txt logo.svg robots.txt \
            __next.__PAGE__.txt __next._full.txt __next._tree.txt \
            _not-found.html _not-found.txt _next _not-found || true
          if git diff --cached --quiet; then
            echo "No publish changes"
            exit 0
          fi
          git commit -m "Deploy Pages site ${GITHUB_SHA}"
          git push origin HEAD:mistress

  server:
    name: activists.miew.ru
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone server
        run: bun run build:server

      - name: Pack release
        run: bash scripts/pack-release.sh

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "${SSH_KEY:-}" ]; then
            echo "DEPLOY_SSH_KEY secret is missing" >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          fi

      - name: Upload and switch release
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "${{ secrets.DEPLOY_USER }}" ] || [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "DEPLOY_USER / DEPLOY_HOST secrets are missing" >&2
            exit 1
          fi
          scp -q release.tgz deploy/remote-deploy.sh "$TARGET:/opt/activiststable/incoming/"
          ssh "$TARGET" "bash /opt/activiststable/incoming/remote-deploy.sh $SHA"
