# Build static site for GitHub Pages on mistress (folder / or /docs).
# Site: https://cw-mod.github.io/activiststable/
name: Deploy to GitHub Pages

on:
  push:
    branches: [mistress]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

      - name: Publish static files to docs/ and root
        run: |
          set -euo pipefail
          rm -rf docs
          mkdir -p docs
          cp -a out/. docs/
          touch docs/.nojekyll

          # Root copies so Pages folder "/" works (mistress source)
          cp -a docs/.nojekyll docs/index.html docs/404.html docs/index.txt docs/logo.svg docs/robots.txt .
          cp -a docs/__next.__PAGE__.txt docs/__next._full.txt docs/__next._tree.txt .
          cp -a docs/_not-found.html docs/_not-found.txt .
          rm -rf _next _not-found
          cp -a docs/_next docs/_not-found .

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .nojekyll index.html 404.html index.txt logo.svg robots.txt \
            __next.__PAGE__.txt __next._full.txt __next._tree.txt \
            _not-found.html _not-found.txt _next _not-found || true
          if git diff --cached --quiet; then
            echo "No publish changes"
            exit 0
          fi
          git commit -m "Deploy Pages site ${GITHUB_SHA}"
          git push origin HEAD:mistress
