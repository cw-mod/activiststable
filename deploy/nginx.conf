# /etc/nginx/sites-available/activiststable.conf
# Only activists.miew.ru. Do not include this from other vhosts.
server {
    listen 80;
    listen [::]:80;
    server_name activists.miew.ru;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name activists.miew.ru;

    ssl_certificate /etc/letsencrypt/live/activists.miew.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/activists.miew.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "activists";
    auth_basic_user_file /etc/nginx/htpasswd/activiststable;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
